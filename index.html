{% extends "base.html" %}

{% block title %}Home Page{% endblock %}

{% block content %}
<section class="card">
    <h1>Welcome, {{ username }}!</h1>
    <p class="date">Today's date: {{ date }}</p>

    <h2>My Items</h2>
    <ul class="item-list">
        {% for item in items %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>

    <p class="note">This page uses Jinja2 to display data passed from Python.</p>
</section>
{% endblock %}
